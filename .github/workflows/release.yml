name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --all-targets --features frp,testing -- -D warnings

      - name: Run tests
        run: cargo test --features frp,testing

  publish:
    name: Publish to crates.io
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2

      - name: Publish
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  version-bump:
    name: Version bump
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Bump to next patch version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          MAJOR="${VERSION%%.*}"
          REST="${VERSION#*.}"
          MINOR="${REST%%.*}"
          PATCH="${REST#*.}"
          NEXT_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
          sed -i "s/^version = \".*\"/version = \"${NEXT_VERSION}\"/" Cargo.toml
          echo "NEXT_VERSION=${NEXT_VERSION}" >> "$GITHUB_ENV"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml
          git commit -m "chore: prepare for next release (${NEXT_VERSION})"
          git push

  build:
    name: Build (linux)
    needs: test
    runs-on: ubuntu-latest
    # Trackball input is Linux-only for now, so only the Linux binary is
    # released.
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --features frp --bin thumbswing-frp

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: thumbswing-frp-linux-x86_64
          path: target/release/thumbswing-frp

  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4

      - name: Prepare release assets
        run: |
          mkdir -p dist
          cp thumbswing-frp-linux-x86_64/thumbswing-frp dist/thumbswing-frp-linux-x86_64
          chmod +x dist/thumbswing-frp-linux-x86_64

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/thumbswing-frp-linux-x86_64
